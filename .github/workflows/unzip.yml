name: Unzip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giải nén
        run: |
          unzip -q RomPoster.zip -d tmp
          rm -rf tmp/RomPoster/.github
          cp -r tmp/RomPoster/. .
          rm -rf tmp RomPoster.zip

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Extract RomPoster"
          git push
